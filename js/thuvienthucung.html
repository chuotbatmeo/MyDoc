<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thư viện thú cưng</title>

  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/index.css">

  <style>
    body{
      padding:20px;
      min-height:100vh;
      overflow-x:hidden;
    }

    .pet-home-btn{
      position:fixed;
      top:12px;
      left:15px;
      width:68px;
      height:68px;
      border-radius:22px;
      background:rgba(255,255,255,0.94);
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      font-size:34px;
      box-shadow:0 8px 24px rgba(0,0,0,0.18);
      z-index:999999;
      transition:.28s ease;
    }

    .pet-home-btn:hover{
      transform:scale(1.08) rotate(-5deg);
    }

    .pet-page{
      max-width:1180px;
      margin:0 auto;
      padding-top:72px;
      text-align:center;
      position:relative;
      z-index:5;
    }

    .pet-title{
      margin-top:10px;
      font-size:58px;
      line-height:1.1;
      font-weight:700;
      color:#fff;
      text-shadow:
        0 0 14px rgba(255,255,255,.92),
        0 0 30px rgba(96,165,250,.75),
        0 0 48px rgba(244,114,182,.45);
      animation:petTitleFloat 3s ease-in-out infinite;
    }

    .pet-title span{
      background:linear-gradient(135deg,#60a5fa,#f472b6,#fbbf24);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
    }

    .pet-subtitle{
      margin-top:8px;
      font-size:20px;
      font-weight:600;
      color:#334155;
      text-shadow:0 0 10px rgba(255,255,255,.92);
    }

    @keyframes petTitleFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-6px)}
    }

    .pet-gallery-wrap{
      margin:36px auto 0;
      width:min(1080px,94vw);
      min-height:560px;
      position:relative;
      border-radius:46px;
      padding:46px 78px;
      background:
        linear-gradient(135deg,rgba(255,255,255,.88),rgba(235,246,255,.74));
      border:1px solid rgba(255,255,255,.9);
      box-shadow:
        0 24px 65px rgba(59,130,246,.18),
        inset 0 0 34px rgba(255,255,255,.7);
      backdrop-filter:blur(10px);
      overflow:hidden;
    }

    .pet-gallery-wrap::before,
    .pet-gallery-wrap::after{
      position:absolute;
      font-size:44px;
      opacity:.18;
      pointer-events:none;
      filter:drop-shadow(0 0 10px rgba(255,255,255,.8));
    }

    .pet-gallery-wrap::before{
      content:"🐾";
      top:24px;
      left:28px;
      transform:rotate(-18deg);
    }

    .pet-gallery-wrap::after{
      content:"🐾";
      right:28px;
      bottom:24px;
      transform:rotate(18deg);
    }

    .pet-empty{
      min-height:420px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      gap:12px;
      color:#2563eb;
      font-size:22px;
      font-weight:700;
      position:relative;
      z-index:3;
    }

    .pet-flow-shell{
      min-height:450px;
      display:none;
      align-items:center;
      justify-content:center;
      position:relative;
      z-index:3;
    }

    .pet-flow-window{
      width:min(880px,82vw);
      height:450px;
      overflow:hidden;
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      -webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 13%,#000 87%,transparent 100%);
      mask-image:linear-gradient(90deg,transparent 0%,#000 13%,#000 87%,transparent 100%);
    }

    .pet-flow-track{
      position:relative;
      height:100%;
      width:100%;
    }

    .pet-flow-card{
      position:absolute;
      top:50%;
      left:50%;
      width:250px;
      height:330px;
      border:none;
      padding:0;
      cursor:pointer;
      overflow:hidden;
      border-radius:34px;
      background:#fff;
      box-shadow:0 16px 38px rgba(15,23,42,.18);
      transform:translate(-50%,-50%);
      transition:
        transform .12s linear,
        opacity .12s linear,
        filter .12s linear,
        box-shadow .12s linear,
        border-radius .12s linear;
      will-change:transform,opacity,filter;
    }

    .pet-flow-card img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      pointer-events:none;
      user-select:none;
    }

    .pet-flow-card.is-center{
      border-radius:42px;
      box-shadow:
        0 34px 88px rgba(59,130,246,.34),
        0 0 0 8px rgba(255,255,255,.50),
        inset 0 0 0 2px rgba(255,255,255,.90);
    }

    .pet-flow-card.is-center::before{
      content:"🐾";
      position:absolute;
      top:18px;
      left:20px;
      font-size:32px;
      opacity:.5;
      z-index:2;
      filter:drop-shadow(0 0 10px rgba(255,255,255,.95));
      pointer-events:none;
    }

    .pet-flow-card:hover{
      box-shadow:
        0 30px 82px rgba(244,114,182,.28),
        0 0 0 7px rgba(255,255,255,.5);
    }

    .pet-nav-btn{
      position:absolute;
      top:50%;
      transform:translateY(-50%);
      width:60px;
      height:60px;
      border:none;
      border-radius:50%;
      cursor:pointer;
      font-size:34px;
      color:#2563eb;
      background:rgba(255,255,255,.94);
      box-shadow:
        0 14px 34px rgba(59,130,246,.24),
        inset 0 0 18px rgba(255,255,255,.8);
      backdrop-filter:blur(10px);
      z-index:10;
      transition:.25s ease;
    }

    .pet-nav-btn:hover{
      transform:translateY(-50%) scale(1.08);
      background:#fff;
      color:#db2777;
      box-shadow:0 18px 40px rgba(244,114,182,.28);
    }

    .pet-nav-prev{left:14px;}
    .pet-nav-next{right:14px;}

    .pet-heart{
      position:fixed;
      pointer-events:none;
      z-index:9999999;
      animation:petHeartFly 1.2s ease forwards;
      font-size:22px;
      filter:drop-shadow(0 0 8px rgba(255,255,255,.8));
    }

    @keyframes petHeartFly{
      0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
      20%{opacity:1}
      100%{opacity:0;transform:translate(-50%,-120px) scale(1.4) rotate(18deg)}
    }

    .pet-paw{
      position:fixed;
      pointer-events:none;
      z-index:999999;
      opacity:.7;
      font-size:18px;
      animation:petPawFade 1.1s ease forwards;
    }

    @keyframes petPawFade{
      0%{opacity:.7;transform:translateY(0) rotate(0deg) scale(.8)}
      100%{opacity:0;transform:translateY(-30px) rotate(18deg) scale(1.1)}
    }

    @media(max-width:900px){
      .pet-gallery-wrap{
        width:min(96vw,760px);
        min-height:430px;
        padding:36px 58px;
      }

      .pet-flow-shell{min-height:350px;}
      .pet-flow-window{height:350px;width:100%;}

      .pet-flow-card{
        width:190px;
        height:270px;
        border-radius:28px;
      }

      .pet-nav-btn{
        width:52px;
        height:52px;
        font-size:30px;
      }
    }

    @media(max-width:768px){
      body{
        padding:15px;
        padding-bottom:28px;
      }

      .pet-home-btn{
        width:58px;
        height:58px;
        font-size:28px;
        top:10px;
        left:10px;
      }

      .clock-wrap.pet-clock{
        top:10px !important;
        right:12px !important;
      }

      .clock-wrap.pet-clock .clock-text{
        font-size:12px;
        max-width:190px;
      }

      .clock-wrap.pet-clock .lunar-text{
        font-size:11px;
        max-width:200px;
      }

      .pet-page{padding-top:74px;}
      .pet-title{font-size:38px;}
      .pet-subtitle{font-size:16px;}

      .pet-gallery-wrap{
        margin-top:24px;
        min-height:335px;
        border-radius:34px;
        padding:26px 42px;
      }

      .pet-flow-shell{min-height:270px;}
      .pet-flow-window{height:270px;}

      .pet-flow-card{
        width:48vw;
        height:58vw;
        max-width:235px;
        max-height:280px;
        border-radius:26px;
      }

      .pet-nav-btn{
        width:42px;
        height:42px;
        font-size:25px;
      }

      .pet-nav-prev{left:4px;}
      .pet-nav-next{right:4px;}
    }

    @media(max-width:430px){
      .pet-gallery-wrap{
        padding:22px 32px;
      }

      .pet-flow-card{
        width:52vw;
        height:64vw;
      }

      .pet-flow-card.is-center::before{
        font-size:26px;
        top:12px;
        left:14px;
      }

      .pet-nav-btn{
        width:38px;
        height:38px;
        font-size:22px;
      }
    }
  </style>
</head>

<body>
  <a href="index.html" class="pet-home-btn" title="Về trang chủ">🏠</a>

  <div class="clock-wrap pet-clock" style="position:fixed;top:12px;right:18px;z-index:999999;">
    <div class="clock-text" id="clockText"></div>
    <div class="lunar-text" id="lunarText"></div>
  </div>

  <main class="pet-page">
    <h1 class="pet-title">🐾 <span>Thư viện thú cưng</span> 🐾</h1>
    <div class="pet-subtitle">Những bé dễ thương ghé ngang, bé ở giữa là nhân vật chính 💕</div>

    <section class="pet-gallery-wrap">
      <div class="pet-empty" id="petEmpty">
        🐶🐱🐰
        <div>Đang tải thư viện thú cưng...</div>
      </div>

      <div class="pet-flow-shell" id="petFlowShell">
        <button class="pet-nav-btn pet-nav-prev" id="petPrevBtn" type="button" title="Ảnh trước">‹</button>
        <div class="pet-flow-window" id="petFlowWindow">
          <div class="pet-flow-track" id="petFlowTrack"></div>
        </div>
        <button class="pet-nav-btn pet-nav-next" id="petNextBtn" type="button" title="Ảnh tiếp theo">›</button>
      </div>
    </section>
  </main>

  <script>

    function INT(d){
      return Math.floor(d);
    }

    function jdFromDate(dd, mm, yy){
      const a = INT((14 - mm) / 12);
      const y = yy + 4800 - a;
      const m = mm + 12 * a - 3;
      let jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - INT(y / 100) + INT(y / 400) - 32045;

      if(jd < 2299161){
        jd = dd + INT((153 * m + 2) / 5) + 365 * y + INT(y / 4) - 32083;
      }

      return jd;
    }

    function getNewMoonDay(k, timeZone){
      const T = k / 1236.85;
      const T2 = T * T;
      const T3 = T2 * T;
      const dr = Math.PI / 180;

      let Jd1 = 2415020.75933 + 29.53058868 * k + 0.0001178 * T2 - 0.000000155 * T3;
      Jd1 += 0.00033 * Math.sin((166.56 + 132.87 * T - 0.009173 * T2) * dr);

      const M = 359.2242 + 29.10535608 * k - 0.0000333 * T2 - 0.00000347 * T3;
      const Mpr = 306.0253 + 385.81691806 * k + 0.0107306 * T2 + 0.00001236 * T3;
      const F = 21.2964 + 390.67050646 * k - 0.0016528 * T2 - 0.00000239 * T3;

      let C1 =
        (0.1734 - 0.000393 * T) * Math.sin(M * dr)
        + 0.0021 * Math.sin(2 * dr * M)
        - 0.4068 * Math.sin(Mpr * dr)
        + 0.0161 * Math.sin(2 * dr * Mpr)
        - 0.0004 * Math.sin(3 * dr * Mpr)
        + 0.0104 * Math.sin(2 * dr * F)
        - 0.0051 * Math.sin((M + Mpr) * dr)
        - 0.0074 * Math.sin((M - Mpr) * dr)
        + 0.0004 * Math.sin((2 * F + M) * dr)
        - 0.0004 * Math.sin((2 * F - M) * dr)
        - 0.0006 * Math.sin((2 * F + Mpr) * dr)
        + 0.0010 * Math.sin((2 * F - Mpr) * dr)
        + 0.0005 * Math.sin((2 * Mpr + M) * dr);

      let deltaT;

      if(T < -11){
        deltaT = 0.001 + 0.000839 * T + 0.0002261 * T2 - 0.00000845 * T3 - 0.000000081 * T * T3;
      }else{
        deltaT = -0.000278 + 0.000265 * T + 0.000262 * T2;
      }

      return INT(Jd1 + C1 - deltaT + 0.5 + timeZone / 24);
    }

    function getSunLongitude(jdn, timeZone){
      const T = (jdn - 2451545.5 - timeZone / 24) / 36525;
      const T2 = T * T;
      const dr = Math.PI / 180;
      const M = 357.52910 + 35999.05030 * T - 0.0001559 * T2 - 0.00000048 * T * T2;
      const L0 = 280.46645 + 36000.76983 * T + 0.0003032 * T2;

      let DL =
        (1.914600 - 0.004817 * T - 0.000014 * T2) * Math.sin(dr * M)
        + (0.019993 - 0.000101 * T) * Math.sin(dr * 2 * M)
        + 0.000290 * Math.sin(dr * 3 * M);

      let L = (L0 + DL) * dr;
      L = L - Math.PI * 2 * INT(L / (Math.PI * 2));

      return INT(L / Math.PI * 6);
    }

    function getLunarMonth11(yy, timeZone){
      const off = jdFromDate(31, 12, yy) - 2415021;
      const k = INT(off / 29.530588853);
      let nm = getNewMoonDay(k, timeZone);
      const sunLong = getSunLongitude(nm, timeZone);

      if(sunLong >= 9){
        nm = getNewMoonDay(k - 1, timeZone);
      }

      return nm;
    }

    function getLeapMonthOffset(a11, timeZone){
      const k = INT((a11 - 2415021.076998695) / 29.530588853 + 0.5);
      let last = 0;
      let i = 1;
      let arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);

      do{
        last = arc;
        i++;
        arc = getSunLongitude(getNewMoonDay(k + i, timeZone), timeZone);
      }while(arc !== last && i < 14);

      return i - 1;
    }

    function convertSolar2Lunar(dd, mm, yy, timeZone){
      const dayNumber = jdFromDate(dd, mm, yy);
      const k = INT((dayNumber - 2415021.076998695) / 29.530588853);
      let monthStart = getNewMoonDay(k + 1, timeZone);

      if(monthStart > dayNumber){
        monthStart = getNewMoonDay(k, timeZone);
      }

      let a11 = getLunarMonth11(yy, timeZone);
      let b11 = a11;
      let lunarYear;

      if(a11 >= monthStart){
        lunarYear = yy;
        a11 = getLunarMonth11(yy - 1, timeZone);
      }else{
        lunarYear = yy + 1;
        b11 = getLunarMonth11(yy + 1, timeZone);
      }

      const lunarDay = dayNumber - monthStart + 1;
      const diff = INT((monthStart - a11) / 29);
      let lunarLeap = 0;
      let lunarMonth = diff + 11;

      if(b11 - a11 > 365){
        const leapMonthDiff = getLeapMonthOffset(a11, timeZone);

        if(diff >= leapMonthDiff){
          lunarMonth = diff + 10;

          if(diff === leapMonthDiff){
            lunarLeap = 1;
          }
        }
      }

      if(lunarMonth > 12){
        lunarMonth -= 12;
      }

      if(lunarMonth >= 11 && diff < 4){
        lunarYear -= 1;
      }

      return [lunarDay, lunarMonth, lunarYear, lunarLeap];
    }

    function getCanChiYear(year){
      const can = ["Canh","Tân","Nhâm","Quý","Giáp","Ất","Bính","Đinh","Mậu","Kỷ"];
      const chi = ["Thân","Dậu","Tuất","Hợi","Tý","Sửu","Dần","Mão","Thìn","Tỵ","Ngọ","Mùi"];
      return can[year % 10] + " " + chi[year % 12];
    }

    function updateClock(){
      const now = new Date();
      const weekdays = ["Chủ Nhật","Thứ Hai","Thứ Ba","Thứ Tư","Thứ Năm","Thứ Sáu","Thứ Bảy"];

      document.getElementById("clockText").innerHTML =
        `${weekdays[now.getDay()]}, ${now.toLocaleDateString("vi-VN")} • ${now.toLocaleTimeString("vi-VN")}`;

      const lunar = convertSolar2Lunar(now.getDate(), now.getMonth() + 1, now.getFullYear(), 7);
      const lunarDay = String(lunar[0]).padStart(2,"0");
      const lunarMonth = String(lunar[1]).padStart(2,"0");
      const leapText = lunar[3] === 1 ? " nhuận" : "";

      document.getElementById("lunarText").innerHTML =
        `🌙 Âm lịch: ${lunarDay}/${lunarMonth}${leapText} năm ${getCanChiYear(lunar[2])}`;
    }

    setInterval(updateClock,1000);
    updateClock();


    const petEmpty = document.getElementById("petEmpty");
    const petFlowShell = document.getElementById("petFlowShell");
    const petFlowWindow = document.getElementById("petFlowWindow");
    const petFlowTrack = document.getElementById("petFlowTrack");
    const petPrevBtn = document.getElementById("petPrevBtn");
    const petNextBtn = document.getElementById("petNextBtn");

    let petImages = [];
    let petOrder = [];
    let petCards = [];
    let flowPosition = 0;
    let flowSpeed = 0.1;
    let lastTime = null;
    let cardStep = 300;
    let autoFrame = null;
    let pauseUntil = 0;

    function normalizePetItem(item, index){
      if(typeof item === "string"){
        return {
          name:`Thú cưng ${index + 1}`,
          src:item.includes("/") ? item : `images/thucung/${item}`
        };
      }

      const rawSrc = item.image || item.file || item.src || "";

      return {
        name:item.name || item.title || `Thú cưng ${index + 1}`,
        src:rawSrc.includes("/") ? rawSrc : `images/thucung/${rawSrc}`
      };
    }

    function shuffleArray(array){
      const cloned = [...array];

      for(let i = cloned.length - 1; i > 0; i--){
        const j = Math.floor(Math.random() * (i + 1));
        [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
      }

      return cloned;
    }

    function createHearts(x, y){
      const icons = ["💗","💖","💕","🐾"];

      for(let i = 0; i < 7; i++){
        const heart = document.createElement("div");
        heart.className = "pet-heart";
        heart.textContent = icons[Math.floor(Math.random() * icons.length)];
        heart.style.left = (x + (Math.random() * 58 - 29)) + "px";
        heart.style.top = (y + (Math.random() * 26 - 13)) + "px";
        heart.style.animationDelay = (Math.random() * .18) + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 1300);
      }
    }

    function getCardStep(){
      if(window.innerWidth <= 430) return window.innerWidth * 0.54;
      if(window.innerWidth <= 768) return window.innerWidth * 0.44;
      if(window.innerWidth <= 900) return 220;
      return 290;
    }

    function buildFlowCards(){
      petFlowTrack.innerHTML = "";
      petCards = [];
      cardStep = getCardStep();

      const repeated = [];
      const loops = Math.max(5, Math.ceil(22 / Math.max(1, petOrder.length)));

      for(let i = 0; i < loops; i++){
        petOrder.forEach(orderIndex => repeated.push(petImages[orderIndex]));
      }

      repeated.forEach((item, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pet-flow-card";
        button.dataset.index = index;
        button.title = "Thả tim cho bé này";
        button.innerHTML = `<img src="${item.src}" alt="${item.name}">`;
        button.addEventListener("click", event => {
          event.stopPropagation();
          createHearts(event.clientX, event.clientY);
          focusCard(index);
        });
        petFlowTrack.appendChild(button);
        petCards.push(button);
      });

      flowPosition = Math.floor(petCards.length / 2) * cardStep;
      updateFlow(true);
    }

    function updateFlow(forceCenter){
      if(!petCards.length) return;

      const totalWidth = petCards.length * cardStep;
      const centerLoop = totalWidth / 2;

      if(flowPosition > totalWidth - cardStep * 6){
        flowPosition -= centerLoop;
      }

      if(flowPosition < cardStep * 4){
        flowPosition += centerLoop;
      }

      let closestCard = null;
      let closestDistance = Infinity;

      petCards.forEach((card, index) => {
        let x = index * cardStep - flowPosition;

        while(x < -totalWidth / 2) x += totalWidth;
        while(x > totalWidth / 2) x -= totalWidth;

        const normalized = Math.min(Math.abs(x) / cardStep, 2.6);
        const centerStrength = Math.max(0, 1 - normalized);
        const scale = 0.72 + centerStrength * 0.48;
        const opacity = Math.max(0, 1 - Math.max(0, normalized - .2) * .35);
        const blur = Math.min(2.2, normalized * .75);
        const rotate = Math.max(-10, Math.min(10, x / cardStep * -5));
        const translateY = centerStrength * -10;

        card.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${translateY}px)) scale(${scale}) rotateY(${rotate}deg)`;
        card.style.opacity = opacity;
        card.style.filter = `saturate(${0.88 + centerStrength * .26}) brightness(${0.92 + centerStrength * .1}) blur(${blur}px)`;
        card.style.zIndex = String(Math.round(10 + centerStrength * 100));

        if(Math.abs(x) < closestDistance){
          closestDistance = Math.abs(x);
          closestCard = card;
        }
      });

      petCards.forEach(card => card.classList.remove("is-center"));
      if(closestCard) closestCard.classList.add("is-center");
    }

    function animateFlow(time){
      if(lastTime === null) lastTime = time;
      const delta = Math.min(40, time - lastTime);
      lastTime = time;

      if(time > pauseUntil){
        flowPosition += flowSpeed * delta;
      }

      updateFlow(false);
      autoFrame = requestAnimationFrame(animateFlow);
    }

    function focusCard(index){
      flowPosition = index * cardStep;
      pauseUntil = performance.now() + 1800;
      updateFlow(true);
    }

    function moveOne(direction){
      flowPosition += direction * cardStep;
      pauseUntil = performance.now() + 1600;
      updateFlow(true);
    }

    petPrevBtn.addEventListener("click", event => {
      event.stopPropagation();
      moveOne(-1);
      createHearts(event.clientX, event.clientY);
    });

    petNextBtn.addEventListener("click", event => {
      event.stopPropagation();
      moveOne(1);
      createHearts(event.clientX, event.clientY);
    });

    window.addEventListener("resize", () => {
      if(!petCards.length) return;
      const centerRatio = flowPosition / cardStep;
      cardStep = getCardStep();
      flowPosition = centerRatio * cardStep;
      updateFlow(true);
    });

    fetch("json/thuvienthucung.json")
    .then(response => response.json())
    .then(data => {
      petImages = data
        .map(normalizePetItem)
        .filter(item => item.src && item.src !== "images/thucung/");

      if(!petImages.length){
        petEmpty.innerHTML = "🐾<div>Chưa có ảnh trong thư viện</div>";
        return;
      }

      petOrder = shuffleArray(petImages.map((_, index) => index));
      petEmpty.style.display = "none";
      petFlowShell.style.display = "flex";
      buildFlowCards();

      if(autoFrame) cancelAnimationFrame(autoFrame);
      autoFrame = requestAnimationFrame(animateFlow);
    })
    .catch(error => {
      console.error("Không tải được thuvienthucung.json", error);
      petEmpty.innerHTML = "🐾<div>Không tải được json/thuvienthucung.json</div>";
    });

    document.addEventListener("mousemove", event => {
      if(Math.random() > 0.965){
        const paw = document.createElement("div");
        paw.className = "pet-paw";
        paw.textContent = "🐾";
        paw.style.left = event.clientX + "px";
        paw.style.top = event.clientY + "px";
        document.body.appendChild(paw);
        setTimeout(() => paw.remove(), 1100);
      }
    });
  </script>
</body>
</html>
