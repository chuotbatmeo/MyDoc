<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cổng Game Mini - Đoán Chữ & Caro</title>
    <style>
        :root { 
            --box-bg: rgba(15, 23, 42, 0.75); 
            --correct: #059669; 
            --present: #D97706; 
            --accent: #2563EB; 
            --absent: #090d16; 
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; user-select: none; }
        
        body { 
            background: #020617;
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            max-height: 100vh;
            overflow: hidden; 
        }

        .phone-frame {
            background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
            width: 100%;
            max-width: 410px;
            height: 100%;
            max-height: 780px;
            border-radius: 36px;
            border: 2px solid rgba(168, 85, 247, 0.6);
            box-shadow: 0 0 35px rgba(147, 51, 234, 0.35), 0 20px 25px -5px rgba(0, 0, 0, 0.7), inset 0 0 25px rgba(168, 85, 247, 0.15);
            display: flex;
            flex-direction: column;
            padding: 10px 10px;
            position: relative;
            overflow: hidden;
        }

        .phone-frame::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 40px 70px, rgba(168, 85, 247, 0.8), rgba(0,0,0,0)),
                radial-gradient(1px 1px at 90px 40px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(2px 2px at 150px 120px, rgba(236, 72, 153, 0.8), rgba(0,0,0,0)),
                radial-gradient(2px 2px at 250px 80px, #ffffff, rgba(0,0,0,0)),
                radial-gradient(1.5px 1.5px at 300px 200px, rgba(59, 130, 246, 0.8), rgba(0,0,0,0));
            background-repeat: repeat;
            background-size: 350px 350px;
            animation: sparkle 20s linear infinite;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes sparkle {
            from { transform: translateY(0); }
            to { transform: translateY(-350px); }
        }

        .main-tabs {
            display: flex;
            width: 100%;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 3px;
            gap: 4px;
            z-index: 10;
            margin-bottom: 8px;
            backdrop-filter: blur(10px);
        }
        .tab-btn {
            flex: 1;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 7px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            box-shadow: 0 2px 10px rgba(124, 58, 237, 0.5);
        }

        .tab-content { display: none; flex-direction: column; flex-grow: 1; z-index: 2; height: 100%; overflow: hidden; }
        .tab-content.active { display: flex; }

        .falling-sticker {
            position: absolute;
            top: -40px;
            font-size: 1.2rem;
            user-select: none;
            pointer-events: none;
            z-index: 1;
            animation: fallDown linear infinite;
        }

        @keyframes fallDown {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            15% { opacity: 0.8; }
            85% { opacity: 0.8; }
            100% { transform: translateY(800px) rotate(360deg); opacity: 0; }
        }

        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 4px;
        }

        .mode-switcher {
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 20px;
            padding: 2px;
            gap: 2px;
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active {
            background: linear-gradient(135deg, #7c3aed, #4f46e5);
            color: #fff;
            box-shadow: 0 2px 8px rgba(124, 58, 237, 0.4);
        }

        .sound-toggle {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #cbd5e1;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }
        .sound-toggle:hover { border-color: #a855f7; }

        .stats-hud {
            display: flex;
            justify-content: flex-end;
            width: 100%;
            padding: 2px 8px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #fbbf24;
        }

        #game-container { 
            display: flex; 
            flex-direction: column; 
            gap: 4px; 
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 340px;
            padding: 2px 0;
        }

        .row { 
            display: flex; 
            gap: 3px; 
            justify-content: center; 
            padding: 3px 6px; 
            border-radius: 10px; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: transparent;
        }

        .row.active-row { 
            background: radial-gradient(circle, rgba(251, 191, 36, 0.18) 0%, rgba(168, 85, 247, 0.1) 70%, transparent 100%);
            box-shadow: 0 0 20px rgba(251, 191, 36, 0.25), inset 0 0 10px rgba(251, 191, 36, 0.15);
        }

        .space-gap { width: 6px; }
        
        .tile { 
            width: 22px; 
            height: 26px; 
            border-radius: 5px; 
            background: var(--box-bg); 
            border: 1.5px solid rgba(168, 85, 247, 0.25); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-size: 0.75rem; 
            font-weight: 700; 
            text-transform: lowercase; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
        }
        .tile.correct { background: var(--correct); border-color: #10b981; box-shadow: 0 0 10px rgba(16, 185, 129, 0.5); }
        .tile.present { background: var(--present); border-color: #f59e0b; box-shadow: 0 0 10px rgba(245, 158, 11, 0.5); }
        .tile.vowel-match { background: var(--accent); border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        .tile.absent { background: var(--absent); border-color: rgba(255, 255, 255, 0.05); opacity: 0.6; }
        
        .main-controls { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            width: 100%; 
            gap: 4px; 
        }

        .legend { 
            background: rgba(15, 23, 42, 0.75); 
            backdrop-filter: blur(10px); 
            padding: 4px 8px; 
            border-radius: 10px; 
            width: 100%; 
            font-size: 0.55rem; 
            display: flex; 
            flex-direction: column; 
            border: 1px solid rgba(168, 85, 247, 0.2); 
        }
        .legend-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
        .legend-item { display: flex; align-items: center; gap: 4px; font-weight: 500; color: #cbd5e1; }
        .legend-box { width: 8px; height: 8px; border-radius: 2px; flex-shrink: 0; }
        .bg-green { background-color: var(--correct); }
        .bg-yellow { background-color: var(--present); }
        .bg-blue { background-color: var(--accent); }
        .bg-dark { background-color: var(--absent); border: 1px solid rgba(255,255,255,0.1); }

        #keyboard { 
            width: 100%; 
            display: flex; 
            flex-direction: column; 
            gap: 3px; 
            padding: 5px; 
            background: rgba(15, 23, 42, 0.85); 
            border-radius: 14px; 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(168, 85, 247, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        .kb-row { display: flex; justify-content: center; gap: 3px; }
        
        .key { 
            background: linear-gradient(145deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95)); 
            color: #f1f5f9; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 5px; 
            height: 30px; 
            font-weight: 600; 
            font-size: 0.7rem; 
            flex: 1; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            cursor: pointer; 
        }
        .key.tone { 
            background: linear-gradient(145deg, rgba(49, 46, 129, 0.8), rgba(30, 27, 75, 0.9)); 
            color: #fde047; 
            font-size: 0.75rem; 
            border-color: rgba(250, 204, 21, 0.3);
        }
        .key.wide { flex: 1.3; font-size: 0.55rem; background: linear-gradient(145deg, #991b1b, #7f1d1d); }
        .key.enter { flex: 1.5; font-size: 0.55rem; background: linear-gradient(145deg, #065f46, #064e3b); }

        /* --- Caro 10x10 Styles --- */
        .caro-header { text-align: center; margin-bottom: 4px; }
        .caro-turn { font-size: 0.95rem; font-weight: 800; color: #facc15; margin-bottom: 2px; }
        .caro-turn span.x { color: #ef4444; }
        .caro-turn span.o { color: #3b82f6; }
        
        #caro-board {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 2px;
            width: 100%;
            max-width: 390px;
            margin: 0 auto;
            flex-grow: 1;
            align-content: center;
        }
        .caro-cell {
            aspect-ratio: 1;
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: 900;
            position: relative;
            cursor: pointer;
            transition: 0.15s;
        }
        .caro-cell:hover { background: rgba(51, 65, 85, 0.95); border-color: #a855f7; }
        .caro-cell.x { color: #ef4444; text-shadow: 0 0 8px rgba(239, 68, 68, 0.6); }
        .caro-cell.o { color: #3b82f6; text-shadow: 0 0 8px rgba(59, 130, 246, 0.6); }
        
        .caro-coord {
            position: absolute;
            top: 1px; left: 2px;
            font-size: 0.38rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 700;
        }

        .btn-reset-caro {
            margin: 8px auto; background: linear-gradient(135deg, #ef4444, #b91c1c);
            color: white; border: none; padding: 7px 18px; border-radius: 12px;
            font-weight: bold; font-size: 0.8rem; cursor: pointer; display: block;
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
        }

        .modal-overlay { 
            position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); 
            backdrop-filter: blur(8px); display: none; justify-content: center; align-items: center; z-index: 100; border-radius: 36px;
        }
        .modal-card { 
            background: linear-gradient(145deg, #1e1b4b, #0f172a); border-radius: 20px; padding: 22px 16px; text-align: center; width: 85%; max-width: 270px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.7); border: 2px solid rgba(168, 85, 247, 0.5);
        }
        .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 4px; color: #f8fafc; }
        .word-highlight { color: #fbbf24; font-weight: 800; font-size: 1.1rem; text-transform: uppercase; }
        .btn-modal-close { 
            background: linear-gradient(135deg, #7c3aed, #4f46e5); color: #fff; border: none; padding: 8px 20px; border-radius: 12px; margin-top: 12px; font-weight: 700; font-size: 0.8rem; cursor: pointer; 
        }

        #toast { 
            position: absolute; top: 6%; background: rgba(15, 23, 42, 0.95); color: #fbbf24; padding: 6px 14px; border-radius: 10px; font-weight: 700; font-size: 0.8rem; display: none; z-index: 50; border: 1px solid rgba(251, 191, 36, 0.4); 
        }
    </style>
</head>
<body>
    <div class="phone-frame" id="phone-frame">
        <div id="toast"></div>

        <div class="main-tabs">
            <button class="tab-btn active" onclick="switchMainTab('doanchu', this)">🔤 Đoán Chữ</button>
            <button class="tab-btn" onclick="switchMainTab('caro', this)">❌ Cờ Caro 10x10 ⭕</button>
        </div>

        <!-- TAB 1: ĐOÁN CHỮ -->
        <div id="tab-doanchu" class="tab-content active">
            <div class="top-bar">
                <div class="mode-switcher">
                    <button class="mode-btn active" id="btn-classic" onclick="setGameMode('classic')">Thư giãn (2 từ)</button>
                    <button class="mode-btn" id="btn-hardcore" onclick="setGameMode('hardcore')">Thử thách (3 từ)</button>
                </div>
                <button class="sound-toggle" id="sound-btn" onclick="toggleSound()" title="Bật/Tắt Âm Thanh">🔊</button>
            </div>

            <div class="stats-hud" id="stats-hud">
                <span id="hud-timer">⏰ 10:00</span>
            </div>

            <div id="game-container"></div>

            <div class="main-controls">
                <div class="legend">
                    <div class="legend-grid">
                        <div class="legend-item"><div class="legend-box bg-green"></div><span>Đúng chữ, dấu & vị trí</span></div>
                        <div class="legend-item"><div class="legend-box bg-yellow"></div><span>Đúng chữ & dấu, sai vị trí</span></div>
                        <div class="legend-item"><div class="legend-box bg-blue"></div><span>Đúng chữ, sai dấu</span></div>
                        <div class="legend-item"><div class="legend-box bg-dark"></div><span>Không có trong từ</span></div>
                    </div>
                </div>
                <div id="keyboard"></div>
            </div>
        </div>

        <!-- TAB 2: CỜ CARO 10x10 -->
        <div id="tab-caro" class="tab-content">
            <div class="caro-header">
                <p style="color: #94a3b8; font-size: 0.7rem; margin-bottom: 2px;">Gõ số ô (1-100) từ kênh chat để đánh!</p>
                <div class="caro-turn" id="turn-indicator">Lượt của: <span class="x">X (Streamer)</span></div>
            </div>
            
            <div id="caro-board"></div>

            <button class="btn-reset-caro" onclick="initCaro()">🔄 Ván Mới</button>
        </div>

        <!-- Modal Thông Báo -->
        <div id="modal" class="modal-overlay">
            <div id="modal-card" class="modal-card">
                <h3 id="modal-title" class="modal-title">THÔNG BÁO</h3>
                <div id="modal-stickers" style="font-size: 2rem; margin: 4px 0;">🎉</div>
                <p id="modal-body" style="font-size: 0.8rem; color: #cbd5e1; line-height: 1.4;"></p>
                <button class="btn-modal-close" onclick="closeModal()">CHƠI VÁN MỚI ➔</button>
            </div>
        </div>
    </div>

    <!-- Khai báo nguồn từ điển & tự động giải mã Base64 từ words2.js -->
    <script src="words.js"></script>
    <script src="words2.js"></script>
    <script>
        function decodeBase64Utf8(base64Str) {
            try {
                const binString = atob(base64Str);
                const bytes = Uint8Array.from(binString, (m) => m.codePointAt(0));
                return new TextDecoder().decode(bytes);
            } catch (e) {
                return base64Str;
            }
        }

        let DICTIONARY_3WORDS = [];
        if (typeof ENCRYPTED_DICTIONARY_3WORDS !== 'undefined' && ENCRYPTED_DICTIONARY_3WORDS.length > 0) {
            DICTIONARY_3WORDS = ENCRYPTED_DICTIONARY_3WORDS.map(item => decodeBase64Utf8(item));
        }
    </script>

    <script>
        function switchMainTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            btn.classList.add('active');
            if (tabId === 'caro' && caroBoard.every(cell => cell === null)) {
                initCaro();
            }
        }

        // --- ĐOÁN CHỮ LOGIC ---
        let gameMode = "classic";
        let targetWord = "", currentAttempt = 0, wordLen = 0, currentGuess = [];
        let soundEnabled = true;
        let gameTimer = null, timeLeft = 600; // Mặc định 10 phút cho chế độ Thư giãn

        const gameContainer = document.getElementById("game-container");
        const keyboard = document.getElementById("keyboard");
        const phoneFrame = document.getElementById("phone-frame");

        const KB_LAYOUT = [
            ["ă","â","ê","ô","ơ","ư","đ"],
            ["´","`","̉","˜","̣"],
            ["q","w","e","r","t","y","u","i","o","p"],
            ["a","s","d","f","g","h","j","k","l"],
            ["DEL","z","x","c","v","b","n","m","ENTER"]
        ];

        const TONE_MAP = {
            '´': { 'a':'á', 'ă':'ắ', 'â':'ấ', 'e':'é', 'ê':'ế', 'i':'í', 'o':'ó', 'ô':'ố', 'ơ':'ớ', 'u':'ú', 'ư':'ứ', 'y':'ý' },
            '`': { 'a':'à', 'ă':'ằ', 'â':'ầ', 'e':'è', 'ê':'ề', 'i':'ì', 'o':'ò', 'ô':'ồ', 'ơ':'ờ', 'u':'ù', 'ư':'ừ', 'y':'ỳ' },
            '̉': { 'a':'ả', 'ă':'ẳ', 'â':'ẩ', 'e':'ẻ', 'ê':'ể', 'i':'ỉ', 'o':'ỏ', 'ô':'ổ', 'ơ':'ở', 'u':'ủ', 'ư':'ử', 'y':'ỷ' },
            '˜': { 'a':'ã', 'ă':'ẵ', 'â':'ẫ', 'e':'ẽ', 'ê':'ễ', 'i':'ĩ', 'o':'õ', 'ô':'ỗ', 'ơ':'ỡ', 'u':'ũ', 'ư':'ữ', 'y':'ỹ' },
            '̣': { 'a':'ạ', 'ă':'ặ', 'â':'ậ', 'e':'ẹ', 'ê':'ệ', 'i':'ị', 'o':'ọ', 'ô':'ộ', 'ơ':'ợ', 'u':'ụ', 'ư':'ự', 'y':'ỵ' }
        };

        const CUTE_STICKERS = ["⭐", "💖", "🌸", "☁️", "✨", "🍀", "💫❤️❤️❤️", "🦄"];

        function getMaxAttempts() { return gameMode === 'hardcore' ? 7 : 6; }
        function getValidCount() { return targetWord.split('').filter(c => c !== " ").length; }

        const winAudio = new Audio('votay.mp3');
        const loseAudio = new Audio('lose.mp3');
        const bgMusic = new Audio('nhacnen.mp3');
        bgMusic.loop = true;
        bgMusic.volume = 0.3;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (!soundEnabled) return;

            if (type === 'key') {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                osc.connect(gainNode); gainNode.connect(audioCtx.destination);
                osc.type = 'sine'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime); 
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start(audioCtx.currentTime); osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'win') {
                winAudio.currentTime = 0;
                winAudio.play().catch(e => console.log("Lỗi phát âm thanh win:", e));
            } else if (type === 'lose') {
                loseAudio.currentTime = 0;
                loseAudio.play().catch(e => console.log("Lỗi phát âm thanh lose:", e));
            }
        }

        function playCaroSound(player) {
            if (!soundEnabled) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            let now = audioCtx.currentTime;

            if (player === 'X') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(550, now);
                osc.frequency.exponentialRampToValueAtTime(700, now + 0.1);
            } else {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(350, now);
                osc.frequency.exponentialRampToValueAtTime(250, now + 0.1);
            }

            gainNode.gain.setValueAtTime(0.12, now);
            gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.start(now);
            osc.stop(now + 0.15);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            document.getElementById("sound-btn").textContent = soundEnabled ? "🔊" : "🔇";
            if (soundEnabled) {
                bgMusic.play().catch(e => console.log("Không thể tự phát nhạc nền:", e));
                showToast("Đã bật âm thanh & nhạc nền");
            } else {
                bgMusic.pause();
                showToast("Đã tắt âm thanh");
            }
        }

        function spawnFallingSticker() {
            const sticker = document.createElement("div");
            sticker.className = "falling-sticker";
            sticker.textContent = CUTE_STICKERS[Math.floor(Math.random() * CUTE_STICKERS.length)];
            sticker.style.left = (Math.random() * 370 + 10) + "px";
            const randomDuration = Math.random() * 4 + 4;
            sticker.style.animationDuration = randomDuration + "s";
            phoneFrame.appendChild(sticker);
            setTimeout(() => sticker.remove(), randomDuration * 1000);
        }
        setInterval(spawnFallingSticker, 1500);

        window.addEventListener('DOMContentLoaded', () => {
            if (typeof DICTIONARY !== 'undefined' && DICTIONARY.length > 0) {
                setGameMode('classic');
                initCaro();
            } else {
                showToast("Lỗi: Không tải được từ điển!");
            }
            
            // Tự động phát nhạc nền khi người dùng tương tác lần đầu
            document.body.addEventListener('click', () => {
                if (soundEnabled && bgMusic.paused) {
                    bgMusic.play().catch(e => console.log(e));
                }
            }, { once: true });
        });

        function setGameMode(mode) {
            gameMode = mode;
            document.getElementById("btn-classic").className = "mode-btn " + (mode === 'classic' ? 'active' : '');
            document.getElementById("btn-hardcore").className = "mode-btn " + (mode === 'hardcore' ? 'active' : '');
            
            // Cả hai chế độ đều có đếm ngược thời gian
            if (mode === 'hardcore') {
                timeLeft = 900; // 15 phút
            } else {
                timeLeft = 600; // 10 phút
            }
            startTimer();
            startNewGame();
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        function startTimer() {
            clearInterval(gameTimer);
            document.getElementById("hud-timer").textContent = `⏰ ${formatTime(timeLeft)}`;
            gameTimer = setInterval(() => {
                timeLeft--;
                document.getElementById("hud-timer").textContent = `⏰ ${formatTime(timeLeft)}`;
                if (timeLeft <= 0) {
                    clearInterval(gameTimer);
                    showModal("HẾT GIỜ RỒI! ⏰", "⌛💔", `Đã hết thời gian thử thách!<br>Đáp án: <span class="word-highlight">${targetWord}</span>`, 'lose');
                }
            }, 1000);
        }

        function startNewGame() {
            if (gameMode === 'hardcore') {
                if (DICTIONARY_3WORDS && DICTIONARY_3WORDS.length > 0) {
                    targetWord = DICTIONARY_3WORDS[Math.floor(Math.random() * DICTIONARY_3WORDS.length)].toLowerCase();
                } else {
                    targetWord = "chúc bạn chơi vui"; 
                }
            } else {
                if (typeof DICTIONARY === "undefined") return;
                const valid = DICTIONARY.filter(w => { let s = (w.match(/ /g)||[]).length; return s === 1; });
                targetWord = valid[Math.floor(Math.random() * valid.length)].toLowerCase();
            }

            wordLen = targetWord.length;
            currentAttempt = 0;
            currentGuess = [];
            initBoard();
            initKeyboard();
        }

        function initBoard() {
            gameContainer.innerHTML = "";
            let maxAtt = getMaxAttempts();
            for (let i = 0; i < maxAtt; i++) {
                const row = document.createElement("div");
                row.className = "row" + (i === 0 ? " active-row" : "");
                row.id = `row-${i}`;

                let wordsArray = targetWord.split(" ");
                wordsArray.forEach((wordPart, wIdx) => {
                    for (let j = 0; j < wordPart.length; j++) {
                        const tile = document.createElement("div");
                        tile.className = "tile";
                        tile.id = `row-${i}-w-${wIdx}-t-${j}`;
                        row.appendChild(tile);
                    }
                    if (wIdx < wordsArray.length - 1) {
                        const space = document.createElement("div");
                        space.className = "space-gap";
                        row.appendChild(space);
                    }
                });
                gameContainer.appendChild(row);
            }
        }

        function initKeyboard() {
            keyboard.innerHTML = "";
            KB_LAYOUT.forEach((rowKeys, rIdx) => {
                const row = document.createElement("div");
                row.className = "kb-row";
                rowKeys.forEach(key => {
                    const btn = document.createElement("button");
                    let cls = "key";
                    if (rIdx === 1) cls += " tone";
                    if (key === "DEL") cls += " wide";
                    if (key === "ENTER") cls += " enter";
                    btn.className = cls;
                    btn.textContent = key;
                    btn.onclick = () => handleKeyPress(key);
                    row.appendChild(btn);
                });
                keyboard.appendChild(row);
            });
        }

        function handleKeyPress(key) {
            let maxAtt = getMaxAttempts();
            if (currentAttempt >= maxAtt) return;
            let validCount = getValidCount();
            playSound('key');

            if (key === "DEL") {
                if (currentGuess.length > 0) { currentGuess.pop(); updateRowDisplay(); }
            } else if (key === "ENTER") {
                if (currentGuess.length === validCount) submitGuess();
                else showToast("Chưa điền đủ ô!");
            } else if (TONE_MAP[key]) {
                if (currentGuess.length > 0) {
                    let lastIdx = currentGuess.length - 1;
                    let lastChar = currentGuess[lastIdx];
                    if (TONE_MAP[key][lastChar]) {
                        currentGuess[lastIdx] = TONE_MAP[key][lastChar];
                        updateRowDisplay();
                    }
                }
            } else {
                if (currentGuess.length < validCount) {
                    currentGuess.push(key.toLowerCase());
                    updateRowDisplay();
                }
            }
        }

        function updateRowDisplay() {
            let wordsArray = targetWord.split(" ");
            let charIndex = 0;

            wordsArray.forEach((wordPart, wIdx) => {
                for (let j = 0; j < wordPart.length; j++) {
                    const tile = document.getElementById(`row-${currentAttempt}-w-${wIdx}-t-${j}`);
                    if (tile) {
                        tile.textContent = currentGuess[charIndex] || "";
                        charIndex++;
                    }
                }
            });
        }

        function getBaseVowels(char) {
            if (!char) return "";
            const toneMap = {'a':'a','á':'a','à':'a','ả':'a','ã':'a','ạ':'a','ă':'ă','ắ':'ă','ằ':'ă','ẳ':'ă','ẵ':'ă','ặ':'ă','â':'â','ấ':'â','ầ':'â','ẩ':'â','ẫ':'â','ậ':'â','e':'e','é':'e','è':'e','ẻ':'e','ẽ':'e','ẹ':'e','ê':'ê','ế':'ê','ề':'ê','ể':'ê','ễ':'ê','ệ':'ê','o':'o','ó':'o','ò':'o','ỏ':'o','õ':'o','ọ':'o','ô':'ô','ố':'ô','ồ':'ô','ổ':'ô','ỗ':'ô','ộ':'ô','ơ':'ơ','ớ':'ơ','ờ':'ơ','ở':'ơ','ỡ':'ơ','ợ':'ơ','u':'u','ú':'u','ù':'u','ủ':'u','ũ':'u','ụ':'u','ư':'ư','ứ':'ư','ừ':'ư','ử':'ư','ữ':'ư','ự':'ư','i':'i','í':'i','ì':'i','ỉ':'i','ĩ':'i','ị':'i','y':'y','ý':'y','ỳ':'y','ỷ':'y','ỹ':'y','ỵ':'y'};
            return toneMap[char.toLowerCase()] || char.toLowerCase();
        }

        function submitGuess() {
            let targetArr = targetWord.split('').filter(c => c !== " ");
            let result = new Array(currentGuess.length).fill("absent");
            let targetUsed = new Array(targetArr.length).fill(false);

            for (let i = 0; i < currentGuess.length; i++) {
                if (currentGuess[i] === targetArr[i]) { result[i] = "correct"; targetUsed[i] = true; }
            }
            for (let i = 0; i < currentGuess.length; i++) {
                if (result[i] !== "correct") {
                    for (let j = 0; j < targetArr.length; j++) {
                        if (!targetUsed[j] && currentGuess[i] === targetArr[j]) { result[i] = "present"; targetUsed[j] = true; break; }
                    }
                }
            }

            const listVowels = ['a','ă','â','e','ê','i','o','ô','ơ','u','ư','y'];
            for (let i = 0; i < currentGuess.length; i++) {
                if (result[i] === "absent") {
                    let guessBase = getBaseVowels(currentGuess[i]);
                    if (listVowels.includes(guessBase)) {
                        for (let j = 0; j < targetArr.length; j++) {
                            if (!targetUsed[j] && guessBase === getBaseVowels(targetArr[j])) { result[i] = "vowel-match"; targetUsed[j] = true; break; }
                        }
                    }
                }
            }

            let wordsArray = targetWord.split(" ");
            let charIndex = 0;
            wordsArray.forEach((wordPart, wIdx) => {
                for (let j = 0; j < wordPart.length; j++) {
                    const tile = document.getElementById(`row-${currentAttempt}-w-${wIdx}-t-${j}`);
                    if (tile) {
                        tile.className = `tile ${result[charIndex]}`;
                        charIndex++;
                    }
                }
            });

            let maxAtt = getMaxAttempts();
            if (currentGuess.join('') === targetArr.join('')) {
                clearInterval(gameTimer);
                showModal("CHIẾN THẮNG XUẤT SẮC! 🎉", "🏆✨🥳", `Đoán đúng cụm từ:<br><span class="word-highlight">${targetWord}</span>`, 'win');
                currentAttempt = maxAtt;
                return;
            }

            document.getElementById(`row-${currentAttempt}`).classList.remove("active-row");
            currentAttempt++;
            currentGuess = [];

            if (currentAttempt < maxAtt) {
                document.getElementById(`row-${currentAttempt}`).classList.add("active-row");
            } else {
                clearInterval(gameTimer);
                showModal("RẤT TIẾC, HẾT LƯỢT! 💔", "😢🥀", `Đáp án đúng là:<br><span class="word-highlight">${targetWord}</span>`, 'lose');
            }
        }

        // --- CỜ CARO 10x10 LOGIC ---
        const boardSize = 10;
        const winCondition = 5;
        let caroBoard = [];
        let currentPlayer = 'X'; 
        let gameActive = true;

        function initCaro() {
            const boardEl = document.getElementById('caro-board');
            boardEl.innerHTML = '';
            caroBoard = Array(boardSize * boardSize).fill(null);
            currentPlayer = 'X';
            gameActive = true;
            updateTurnIndicator();

            for (let i = 0; i < boardSize * boardSize; i++) {
                const cell = document.createElement('div');
                cell.className = 'caro-cell';
                cell.onclick = () => handleCaroClick(i);

                const number = document.createElement('span');
                number.className = 'caro-coord';
                number.innerText = (i + 1);

                const symbol = document.createElement('span');
                symbol.className = 'caro-symbol';
                
                cell.appendChild(number);
                cell.appendChild(symbol);
                boardEl.appendChild(cell);
            }
        }

        function handleCaroClick(index) {
            if (!gameActive || caroBoard[index] !== null) return;

            playCaroSound(currentPlayer);

            caroBoard[index] = currentPlayer;
            const cells = document.querySelectorAll('.caro-cell');
            cells[index].classList.add(currentPlayer.toLowerCase());
            cells[index].querySelector('.caro-symbol').innerText = currentPlayer;

            if (checkCaroWin(index)) {
                document.getElementById('turn-indicator').innerHTML = `🎉 <span class="${currentPlayer.toLowerCase()}">${currentPlayer}</span> CHIẾN THẮNG!`;
                showModal("KẾT QUẢ CỜ CARO 🏆", "⚔️👑", `Bên <span class="word-highlight">${currentPlayer}</span> đã giành chiến thắng!`, 'win');
                gameActive = false;
                return;
            }

            if (!caroBoard.includes(null)) {
                document.getElementById('turn-indicator').innerHTML = "🤝 HÒA NHAU!";
                showModal("VÁN CỜ HÒA! 🤝", "🤝✨", `Bàn cờ đã đầy ô mà chưa phân thắng bại!`, 'lose');
                gameActive = false;
                return;
            }

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            updateTurnIndicator();
        }

        function updateTurnIndicator() {
            const indicator = document.getElementById('turn-indicator');
            if (currentPlayer === 'X') {
                indicator.innerHTML = 'Lượt của: <span class="x">X (Streamer)</span>';
            } else {
                indicator.innerHTML = 'Lượt của: <span class="o">O (Kênh Chat)</span>';
            }
        }

        function checkCaroWin(index) {
            const row = Math.floor(index / boardSize);
            const col = index % boardSize;
            const player = caroBoard[index];
            const directions = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let [dx, dy] of directions) {
                let count = 1;
                for (let i = 1; i < winCondition; i++) {
                    let r = row + dx * i, c = col + dy * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && caroBoard[r * boardSize + c] === player) count++;
                    else break;
                }
                for (let i = 1; i < winCondition; i++) {
                    let r = row - dx * i, c = col - dy * i;
                    if (r >= 0 && r < boardSize && c >= 0 && c < boardSize && caroBoard[r * boardSize + c] === player) count++;
                    else break;
                }
                if (count >= winCondition) return true;
            }
            return false;
        }

        function showModal(title, stickers, body, soundType) {
            document.getElementById("modal-title").innerHTML = title;
            document.getElementById("modal-stickers").innerHTML = stickers;
            document.getElementById("modal-body").innerHTML = body;
            document.getElementById("modal").style.display = "flex";
            
            if (soundType) {
                playSound(soundType);
            }
        }

        function closeModal() { 
            document.getElementById("modal").style.display = "none"; 
            if (document.getElementById('tab-doanchu').classList.contains('active')) {
                setGameMode(gameMode);
            } else {
                initCaro();
            }
        }

        function showToast(msg) {
            const t = document.getElementById("toast"); 
            t.textContent = msg; t.style.display = "block";
            setTimeout(() => t.style.display = "none", 1500);
        }

        document.addEventListener('keydown', (e) => {
            if (!document.getElementById('tab-doanchu').classList.contains('active')) return;
            if (e.key === 'Enter') handleKeyPress('ENTER');
            else if (e.key === 'Backspace') handleKeyPress('DEL');
            else if (/^[a-zA-ZăâêôơưđĂÂÊÔƠƯĐ]$/.test(e.key)) handleKeyPress(e.key.toLowerCase());
        });
    </script>
</body>
